
path_validator_node:
  ros__parameters:
    self_machine_id: 1

    # --- 좌표계 / TF ---
    global_frame: "map" #"map"
    base_frame: "base_link"


    kernel_half_size: 1  #2 ## footprint방식이면 안쓰는 파라미터
    consecutive_threshold: 2 #4 #2 #3           # 연속 차단 포인트 개수 임계값
    # --- 검사 방식 전환(포인트 vs 로봇 footprint) ---
    use_footprint_check: true         # true면 footprint 방식, false면 점방식
    footprint_step_m: 0.15 #0.25 #0.15             # footprint 방식에서 경로 샘플 간격(m)


    # --- 리플랜 트리거 일반 조건 ---
    cooldown_sec: 1.0                 # 리플랜 트리거 쿨다운(초)
    obstacle_persistence_sec: 1.5 #0.5      # 차단 셀의 지속 시간 요구치(초) 즉, 해당 시간동안 plan 위에 감지되어야 비로소 replan.
    max_speed: 0.5                     # 로봇 속도 상한(lookahead 계산용)
    lookahead_time_sec: 15.0           # 속도 기반 lookahead 시간(초)
    min_lookahead_m: 0.8 #2.0               # lookahead 최소 거리(m)
    cost_threshold: 254.0              # 마스터 코스트맵 차단 임계(권장: 200~254)
    ignore_unknown: true               # NO_INFORMATION(255) 무시 여부

    # --- 차단 후보 DB(ROI 스캔) ---
    db_update_frequency: 5.0           # DB 갱신 주기(Hz)
    obstacle_prune_timeout_sec: 3.0    # DB에서 관측 끊긴 셀 제거 시간(초)
    db_stride: 1 #2                       # ROI 스캔 격자 스텝(1=전셀, 2=샘플링)
    cone_angle_deg: 170.0 # 100.0              # 전방 부채꼴 각도(도)


    # --- 경로 검사 범위 ---
    path_check_distance_m: 8.0 #6.0         # 경로 따라 검사하는 최대 거리(m)

    # --- 리플랜 플래그 퍼블리시 ---
    publish_false_pulse: false #true          # true 펄스 후 false로 클리어할지  testing..
    flag_pulse_ms: 120                 # false 펄스 지연(ms)



    # --- 에이전트 마스크(AgentLayer 코스트맵) 비교 ---
    compare_agent_mask: true
    agent_mask_topic: "/global_costmap/agent_layer/raw_costmap_raw"  # AgentLayer가 퍼블리시하는 마스크 토픽
    agent_cost_threshold: 254.0 # 254.0        # 에이전트 마스크에서 차단으로 간주하는 임계
    agent_mask_manhattan_buffer: 5 #200 #100 # 5 #200 #100 #1     # 맨해튼 반경(셀) 내에 마스크가 있으면 히트로 간주


    # --- 충돌 메타 퍼블리시(커스텀 메시지) ---
    publish_agent_collision: true
    agent_collision_topic: "/path_agent_collision_info"


    # --- MultiAgentInfoArray 연동(가해자 식별용) ---
    agents_topic: "/multi_agent_infos" # MultiAgentInfoArray 토픽
    agents_freshness_timeout_ms: 800   # 최신 에이전트 정보 허용 지연(ms)
    agent_match_dilate_m: 0.001 #0.15 #2.0 # 1.0 # 0.15 #0.05         # 가해자 매칭 시 footprint 소확장(m)



    # --- Nav2 footprint/radius (둘 중 하나만 실사용) ---
    # footprint 가 유효한 다각형 문자열이면 그것을 사용,
    # 아니면 robot_radius 를 원형 발자국으로 사용
    footprint: "[[0.315, 0.315], [0.315, -0.315], [-0.315, -0.315], [-0.315, 0.315]]"    
    # robot_radius: 0.30                 # footprint 미지정 시 사용되는 반지름(m)    


    # 에이전트 홀드
    agent_block_hold_sec: 2.0
    agent_block_max_wait_sec: 8.0

    # === NEW: 에이전트 경로 튜브 매칭 ===
    agent_path_hit_enable: true
    agent_path_hit_stride_m: 0.25   # 0.35 
    agent_path_hit_dilate_m: 0.001 #0.02 
    agent_path_hit_max_poses: 99999

# [NEW] 나보다 ID가 작은(우선순위가 높은) 에이전트의 경로 튜브도 무조건 반영할지 여부
    # true: 모든 에이전트의 경로 튜브 반영 (기존 방식)
    # false: 나보다 ID가 큰 에이전트의 경로 튜브만 반영
    respect_higher_priority_path: false


    # [FIX] 키 이름이 코드의 선언(validation_frequency)과 달라 이 설정이 통째로
    # 무시되고 있었다. ROS 2 는 선언되지 않은 override 를 조용히 버린다.
    # 그동안 노드는 코드 기본값 10 Hz 로 돌았고(노드 배너로 실측), 롱런과
    # 검증 수치가 모두 그 10 Hz 에서 나왔다. 그래서 동작을 바꾸지 않고
    # 이름과 값을 실제 동작(10 Hz)에 맞춘다.
    validation_frequency: 10.0 # 10 Hz로 주기적 경로 검증 (충돌 감지 시 즉시 리플랜 신호 발행, false pulse 포함 여부는 publish_false_pulse에 따름)

    goal_doorstep_static_m: 0.1 # 목표 지점 주변의 정적 장애물 허용 반경 (미터 단위)
    goal_doorstep_agent_m: 0.05  # 목표 지점 주변의 에이전트 허용 반경 (미터 단위, 일반적으로 static보다 작게 설정)



    robot_ids: ["AMMR_2P_TRAY1", "AMMR_2P_TRAY2", "AMMR_2P_TRAY3", "AMMR_2P_TRAY4", "AMMR_2P_TRAY5", "AMMR_2P_TRAY6", "robot_001", "robot_002", "warehouse_bot_A"]

    # 2. 각 로봇 ID를 네임스페이스(키)로 사용하여 상세 파라미터를 정의합니다.

    AMMR_2P_TRAY1:
      type_id: "AMR_MANIPULATOR_2P_TRAY"
      machine_id: 1
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    AMMR_2P_TRAY2:
      type_id: "AMR_MANIPULATOR_2P_TRAY"
      machine_id: 2
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    AMMR_2P_TRAY3:
      type_id: "AMR_MANIPULATOR_2P_TRAY"
      machine_id: 3
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    AMMR_2P_TRAY4:
      type_id: "AMR_MANIPULATOR_2P_TRAY"
      machine_id: 4
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    AMMR_2P_TRAY5:
      type_id: "AMR_MANIPULATOR_2P_TRAY"
      machine_id: 5
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    AMMR_2P_TRAY6:
      type_id: "AMR_MANIPULATOR_2P_TRAY"
      machine_id: 6
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"


    # --- 로봇 1 (원형) ---
    robot_001:
      type_id: "TYPE_A_TURTLE"
      machine_id: 11
      # Nav2 등에서 footprint가 비어있으면 robot_radius를 사용합니다.
      robot_radius: 0.0
      # footprint를 문자열 "[]" 로 지정하거나 아예 생략합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    # --- 로봇 2 (사각형) ---
    robot_002:
      type_id: "amr"
      machine_id: 5
      # footprint를 사용할 것이므로 radius는 0.0 또는 무시됩니다.
      robot_radius: 0.0
      # Nav2 Costmap 2D는 이 문자열 형식을 잘 파싱합니다.
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"

    # --- 로봇 3 (로봇 1과 같은 타입) ---
    warehouse_bot_A:
      type_id: "amr"
      machine_id: 101
      robot_radius: 0.0
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
    
    # [V2 M-6] 자기 발자국 안의 정적 lethal 셀은 HIT 로 세지 않는다 (amhs 이관 09-27, sim 검증)
    ignore_static_hit_in_self_footprint: true
    self_footprint_margin_m: 0.05
    # [V2.30] READY 출발 점검: 로봇→남은 목표 누적 노선 거리가 이 값을 넘는 목표는 출발 판단에서 뺀다 (0=무제한, amhs 이관 09-27)
    ready_goal_horizon_m: 3.0
