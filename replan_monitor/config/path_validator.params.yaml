path_validator_node:
  ros__parameters:
    self_machine_id: 1
    
    # Frames
    global_frame: "map"
    base_frame: "base_link"

    # Event pulse / cooldown
    cooldown_sec: 0.2 #1.0         ## replan_flag/충돌 감지 후 다음 감지까지 최소 대기 시간
    publish_false_pulse: false #true
    flag_pulse_ms: 120

    # Obstacle persistence & thresholds
    obstacle_persistence_sec: 0.5
    cost_threshold: 200.0         # 보수적으로 높게 시작 (inflated 영역 기준)

    # Detection ROI / DB
    max_speed: 0.5
    lookahead_time_sec: 15.0
    min_lookahead_m: 2.0
    db_update_frequency: 5.0      # Hz
    obstacle_prune_timeout_sec: 3.0
    db_stride: 2                  # 1이면 모든 셀 검사, 2 이상이면 샘플링
    cone_angle_deg: 100.0         # 전방 부채꼴 각도
    kernel_half_size: 1           # 1 => 3x3 커널로 블록 검사
    ignore_unknown: true          # Unknown(255) 제외 (권장)

    # Path validation
    consecutive_threshold: 3      # 연속 K 포인트 이상 차단되면 리플랜
    path_check_distance_m: 6.0    # 경로 검사 상한 거리(가까운 구간만)

    # Typical sim param
    use_sim_time: false


# [NEW] 나보다 ID가 작은(우선순위가 높은) 에이전트의 경로 튜브도 무조건 반영할지 여부
    # true: 모든 에이전트의 경로 튜브 반영 (기존 방식)
    # false: 나보다 ID가 큰 에이전트의 경로 튜브만 반영
    respect_higher_priority_path: false

    validation_frequency_hz: 5.0 # 5 Hz로 주기적 경로 검증 (충돌 감지 시 즉시 리플랜 신호 발행, false pulse 포함 여부는 publish_false_pulse에 따름)
    goal_doorstep_static_m: 0.1 # 목표 지점 주변의 정적 장애물 허용 반경 (미터 단위)
    goal_doorstep_agent_m: 0.05  # 목표 지점 주변의 에이전트 허용 반경 (미터 단위, 일반적으로 static보다 작게 설정)